# Alembic migrations for the money-transaction database.
#
# Run from the project root:
#     alembic upgrade head
#     alembic revision --autogenerate -m "describe the change"
#
# The database URL comes from the app settings (DATABASE_URL in the environment
# or .env, default sqlite+aiosqlite:///./data/smaia.db). Override per command with
#     alembic -x url=postgresql+asyncpg://user:pass@host/db upgrade head

[alembic]
script_location = %(here)s/src/db/migrations
# src/ on sys.path so env.py imports `db` / `channels` the same way the API does.
prepend_sys_path = %(here)s/src
path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
